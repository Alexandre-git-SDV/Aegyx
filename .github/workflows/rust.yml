name: Rust

on:
  push:
    branches: ["main" , "development"]
  pull_request:
    branches: ["main" , "development"]

# Least privilege: these jobs only need to read the code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
  
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: cargo test --verbose

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Clippy
      run: rustup component add clippy
    - name: Run Clippy
      run: cargo clippy --all-targets --all-features
